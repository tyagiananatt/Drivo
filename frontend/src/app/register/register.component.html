<div class="auth-split">
  <div class="auth-split-left">
    <!-- Image background only -->
  </div>
  
  <div class="auth-split-right">
    <div class="auth-box" style="max-width: 460px;">
      <div style="margin-bottom: 40px;">
        <h2 class="title" style="margin-bottom: 12px; font-size: 32px;">Get Started</h2>
        <p>Register as a Super Vendor</p>
      </div>
      
      @if (error) {
        <div style="background: var(--danger-soft); color: var(--danger); padding: 16px; border-radius: 8px; margin-bottom: 24px; font-size: 14px; border: 1px solid rgba(239, 68, 68, 0.3);">
          {{ error }}
        </div>
      }

      <form (ngSubmit)="register()">
        <div class="flex gap-4">
          <div class="form-group" style="flex: 1;">
            <label>First Name</label>
            <input type="text" [(ngModel)]="data.firstName" name="firstName" class="form-control" placeholder="John" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Last Name</label>
            <input type="text" [(ngModel)]="data.lastName" name="lastName" class="form-control" placeholder="Doe" required>
          </div>
        </div>
        <div class="form-group">
          <label>Company Name</label>
          <input type="text" [(ngModel)]="data.companyName" name="companyName" class="form-control" placeholder="Acme Logistics" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="data.email" name="email" class="form-control" placeholder="admin@example.com" required>
        </div>
        <div class="form-group" style="margin-bottom: 32px;">
          <label>Password</label>
          <input type="password" [(ngModel)]="data.password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
      </form>

      <div style="margin-top: 32px; text-align: center; font-size: 15px;">
        <span style="color: var(--text-secondary);">Already have an account? </span>
        <a routerLink="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In</a>
      </div>
    </div>
  </div>
</div>
