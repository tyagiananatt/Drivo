<div class="auth-split">
  <div class="auth-split-left" style="background-image: radial-gradient(circle at center, rgba(212, 255, 0, 0.1) 0%, rgba(15, 16, 14, 0.95) 100%), url('https://images.unsplash.com/photo-1519003722824-194d4455a60c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');">
    <div>
      <div class="brand" style="margin-bottom: 24px; font-size: 32px;">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="4" height="4"/><rect x="8" y="2" width="4" height="4"/><rect x="14" y="2" width="4" height="4"/><rect x="2" y="8" width="4" height="4"/><rect x="8" y="8" width="4" height="4"/><rect x="14" y="8" width="4" height="4"/><rect x="2" y="14" width="4" height="4"/><rect x="8" y="14" width="4" height="4"/><rect x="14" y="14" width="4" height="4"/></svg>
        </div>
        Drivo
      </div>
    </div>
    
    <div style="position: relative; z-index: 2;">
      <h1 style="font-size: 48px; line-height: 1.1; margin-bottom: 16px; font-weight: 900; letter-spacing: 2px;">
        <span style="color: var(--primary);">LAUNCH</span><br>YOUR EMPIRE.
      </h1>
      <p style="font-size: 18px; max-width: 400px; color: var(--text-secondary);">
        Create your super-vendor account and deploy a massive fleet network across the globe.
      </p>
    </div>
  </div>
  
  <div class="auth-split-right">
    <div class="auth-box" style="max-width: 460px;">
      <div style="margin-bottom: 40px;">
        <h2 class="title" style="margin-bottom: 12px; font-size: 32px;">Get Started</h2>
        <p>Register as a Super Vendor</p>
      </div>
      
      @if (error) {
        <div style="background: var(--danger-soft); color: var(--danger); padding: 16px; border-radius: 8px; margin-bottom: 24px; font-size: 14px; border: 1px solid rgba(239, 68, 68, 0.3);">
          {{ error }}
        </div>
      }

      <form (ngSubmit)="register()">
        <div class="flex gap-4">
          <div class="form-group" style="flex: 1;">
            <label>First Name</label>
            <input type="text" [(ngModel)]="data.firstName" name="firstName" class="form-control" placeholder="John" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Last Name</label>
            <input type="text" [(ngModel)]="data.lastName" name="lastName" class="form-control" placeholder="Doe" required>
          </div>
        </div>
        <div class="form-group">
          <label>Company Name</label>
          <input type="text" [(ngModel)]="data.companyName" name="companyName" class="form-control" placeholder="Acme Logistics" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="data.email" name="email" class="form-control" placeholder="admin@example.com" required>
        </div>
        <div class="form-group" style="margin-bottom: 32px;">
          <label>Password</label>
          <input type="password" [(ngModel)]="data.password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
      </form>

      <div style="margin-top: 32px; text-align: center; font-size: 15px;">
        <span style="color: var(--text-secondary);">Already have an account? </span>
        <a routerLink="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In</a>
      </div>
    </div>
  </div>
</div>
