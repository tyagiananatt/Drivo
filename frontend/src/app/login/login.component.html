<div class="auth-split">
  <div class="auth-split-left">
    <div>
      <div class="brand" style="margin-bottom: 24px; font-size: 32px;">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="4" height="4"/><rect x="8" y="2" width="4" height="4"/><rect x="14" y="2" width="4" height="4"/><rect x="2" y="8" width="4" height="4"/><rect x="8" y="8" width="4" height="4"/><rect x="14" y="8" width="4" height="4"/><rect x="2" y="14" width="4" height="4"/><rect x="8" y="14" width="4" height="4"/><rect x="14" y="14" width="4" height="4"/></svg>
        </div>
        Drivo
      </div>
    </div>
    
    <div style="position: relative; z-index: 2;">
      <h1 style="font-size: 48px; line-height: 1.1; margin-bottom: 16px; font-weight: 900; letter-spacing: 2px;">
        <span style="color: var(--primary);">COMMAND</span><br>YOUR FLEET.
      </h1>
      <p style="font-size: 18px; max-width: 400px; color: var(--text-secondary);">
        The most advanced platform to manage vehicles, drivers, and compliance at scale.
      </p>
    </div>
  </div>
  
  <div class="auth-split-right">
    <div class="auth-box">
      <div style="margin-bottom: 40px;">
        <h2 class="title" style="margin-bottom: 12px; font-size: 32px;">Welcome Back</h2>
        <p>Sign in to access your command center</p>
      </div>
      
      @if (error) {
        <div style="background: var(--danger-soft); color: var(--danger); padding: 16px; border-radius: 8px; margin-bottom: 24px; font-size: 14px; border: 1px solid rgba(239, 68, 68, 0.3);">
          {{ error }}
        </div>
      }

      <form (ngSubmit)="login()">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="credentials.email" name="email" class="form-control" placeholder="admin@example.com" required>
        </div>
        <div class="form-group" style="margin-bottom: 32px;">
          <label>Password</label>
          <input type="password" [(ngModel)]="credentials.password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>

      <div style="margin-top: 32px; text-align: center; font-size: 15px;">
        <span style="color: var(--text-secondary);">Don't have an account? </span>
        <a routerLink="/register" style="color: var(--primary); text-decoration: none; font-weight: 600;">Register</a>
      </div>
    </div>
  </div>
</div>
